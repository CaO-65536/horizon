name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profile (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      cargo_flags:
        description: 'Extra Cargo Flags (e.g. --features mods)'
        required: false
        default: ''
        type: string

jobs:
  build-apk:
    name: Build Android APK
    # 临时将运行环境锁定在 ubuntu-22.04，以避免 ubuntu-latest 镜像升级导致的工具链不兼容问题
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    # 升级到最新或兼容的 setup-android 版本
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platforms;android-35
          build-tools;35.0.0
          ndk;27.2.12479018
          platform-tools

    - name: Set up Environment Variables
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

    - name: Build APK
      run: |
        PROFILE="${{ github.event.inputs.profile || 'debug' }}"
        CARGO_FLAGS="${{ github.event.inputs.cargo_flags }}"
        
        echo "Building with PROFILE=$PROFILE and CARGO_FLAGS=$CARGO_FLAGS"
        
        PROFILE="$PROFILE" CARGO_FLAGS="$CARGO_FLAGS" ./packaging/android/build_apk.sh
      shell: bash

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: horizon-apk-${{ github.event.inputs.profile || 'debug' }}
        path: target/android/horizon.apk
