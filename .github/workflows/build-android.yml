name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profile (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      cargo_flags:
        description: 'Extra Cargo Flags (e.g. --features mods)'
        required: false
        default: ''
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK Manually
      run: |
        echo "Setting up Android SDK..."
        export ANDROID_HOME=$HOME/android/sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        CMD_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        wget -q $CMD_TOOLS_URL -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;27.2.12479018" \
          "platform-tools"
          
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      shell: bash

    - name: Build APK
      run: |
        # 1. 显式覆盖并统一 Android 环境变量，完全隔离 GitHub Actions 预置的 NDK 路径
        export ANDROID_HOME="$HOME/android/sdk"
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_ROOT

        # 2. 获取输入参数（兼顾手动触发和 push 触发的兜底）
        PROFILE="${{ github.event.inputs.profile || 'debug' }}"
        CARGO_FLAGS="${{ github.event.inputs.cargo_flags }}"
        
        echo "Building with PROFILE=$PROFILE and CARGO_FLAGS=$CARGO_FLAGS"
        
        # 3. 执行打包脚本
        PROFILE="$PROFILE" CARGO_FLAGS="$CARGO_FLAGS" ./packaging/android/build_apk.sh
      shell: bash

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: horizon-apk-${{ github.event.inputs.profile || 'debug' }}
        path: target/android/horizon.apk
