name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # 当推送形如 v1.0.0 的标签时自动触发 Release
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profile (debug / release)'
        required: true
        default: 'release' # 发布 Release 时默认推荐 release
        type: choice
        options:
          - debug
          - release
      cargo_flags:
        description: 'Extra Cargo Flags (e.g. --features mods)'
        required: false
        default: ''
        type: string
      create_release:
        description: '是否自动创建 GitHub Release 并上传 APK'
        required: true
        default: true
        type: boolean

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK Manually
      run: |
        echo "Setting up Android SDK..."
        export ANDROID_HOME=$HOME/android/sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        CMD_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        wget -q $CMD_TOOLS_URL -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;27.2.12479018" \
          "platform-tools"
          
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      shell: bash

    - name: Build APK
      run: |
        # 显式覆盖并统一 Android 环境变量，完全隔离预置的 NDK 路径
        export ANDROID_HOME="$HOME/android/sdk"
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_ROOT

        # 获取输入参数
        PROFILE="${{ github.event.inputs.profile || 'release' }}"
        CARGO_FLAGS="${{ github.event.inputs.cargo_flags }}"
        
        echo "Building with PROFILE=$PROFILE and CARGO_FLAGS=$CARGO_FLAGS"
        
        PROFILE="$PROFILE" CARGO_FLAGS="$CARGO_FLAGS" ./packaging/android/build_apk.sh
      shell: bash

    - name: Upload APK Artifact (Actions Storage)
      uses: actions/upload-artifact@v4
      with:
        name: horizon-apk-${{ github.event.inputs.profile || 'release' }}
        path: target/android/horizon.apk

    - name: Generate Release Tag and Name
      id: tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="v0.0.0-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create GitHub Release and Upload APK
      if: |
        github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.version }}
        name: "Horizon Android Build ${{ steps.tag.outputs.version }}"
        files: target/android/horizon.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
