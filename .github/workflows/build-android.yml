name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profile (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      cargo_flags:
        description: 'Extra Cargo Flags (e.g. --features mods)'
        required: false
        default: ''
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 【核心修改】使用纯 Shell 命令手动下载和配置 Android SDK 与 NDK，避开插件兼容 Bug
    - name: Set up Android SDK Manually
      run: |
        echo "Setting up Android SDK..."
        export ANDROID_HOME=$HOME/android/sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        # 下载官方 Android SDK Command-line Tools (cmdline-tools)
        # 对应你本地命令中的 cmdline-tools
        CMD_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        wget -q $CMD_TOOLS_URL -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        
        # 按照 sdkmanager 的目录结构要求，将解压后的文件放入 latest 目录
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        # 配置环境变量
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
        # 自动接受 SDK 许可证
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # 安装指定的平台、构建工具、NDK 和 platform-tools
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;27.2.12479018" \
          "platform-tools"
          
        # 设置 ANDROID_NDK_HOME 环境变量
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      shell: bash

    - name: Build APK
      run: |
        PROFILE="${{ github.event.inputs.profile || 'debug' }}"
        CARGO_FLAGS="${{ github.event.inputs.cargo_flags }}"
        
        echo "Building with PROFILE=$PROFILE and CARGO_FLAGS=$CARGO_FLAGS"
        
        PROFILE="$PROFILE" CARGO_FLAGS="$CARGO_FLAGS" ./packaging/android/build_apk.sh
      shell: bash

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: horizon-apk-${{ github.event.inputs.profile || 'debug' }}
        path: target/android/horizon.apk
